# Local one-shot. cap_drop ALL. No key material is mounted.
services:
  perimeterctl:
    build:
      context: ..
      dockerfile: Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    volumes:
      - sentinel-home:/home
    command: ["--home", "/home", "version"]

volumes:
  sentinel-home:
